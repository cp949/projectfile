# 검증 전용 워크플로. 배포하지 않고 비밀 값을 쓰지 않는다. 배포 절차는 docs/release.md를 따른다.
name: ci

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

# pull request는 같은 ref의 이전 실행을 새 실행이 취소한다.
# main·dev push는 커밋마다 그룹을 따로 둔다.
# 같은 그룹이면 대기 중인 실행이 새 실행에 밀려 취소되므로, 연달아 push한 커밋의 검증 결과가 빠진다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm 버전은 루트 package.json의 packageManager 필드를 따른다.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # pnpm이 먼저 설치되어 있어야 cache: pnpm이 저장소 경로를 찾는다.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 검사 목록은 루트 package.json의 verify 스크립트가 정한다.
      # check:license가 npm pack --dry-run의 LICENSE 포함까지 확인하므로 별도 단계를 두지 않는다.
      - run: pnpm verify

      # verify의 build가 만든 dist를 pack해 package.json 메타데이터와 타입 해석을 검사한다.
      # 결과가 Node 버전에 따라 달라지지 않아 matrix를 도는 consume 작업에 넣지 않는다.
      # 범위와 이유는 docs/agents/testing.md의 "패키지 검사"를 따른다.
      - run: pnpm check:package

  # Chromium에서 `Blob` 경로 시험 일부를 돈다. `verify`는 Chromium 다운로드에 의존하지 않으므로 별도 작업으로 둔다.
  # 범위와 이유는 docs/agents/testing.md의 "브라우저 시험"을 따른다.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Chromium 다운로드는 아래 설치 단계에서만 한다. 브라우저 캐시는 쓰지 않는다.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # headless 시험은 Chrome Headless Shell만 쓴다. 전체 Chromium은 받지 않는다.
      - run: pnpm --filter @cp949/projectfile exec playwright-core install --with-deps --only-shell chromium

      - run: pnpm --filter @cp949/projectfile test:browser

  # 빌드한 패키지를 Node 버전별로 소비해 본다. 전체 시험은 verify 작업의 Node 24에서만 돈다.
  # 시험 버전은 선언한 범위(engines.node >=24.18) 안의 최저 24.18, 24 계열 24, 현재 최신 메이저 26이다.
  # setup-node는 부분 버전을 semver 범위로 푼다(24.18은 24.18.x).
  # check-latest를 켜지 않아 runner 이미지에 캐시된 버전을 먼저 쓴다. 24는 캐시된 24.x라 공개 최신 패치보다 늦을 수 있다.
  # 범위와 이유는 docs/agents/testing.md의 "소비 검사"를 따른다.
  consume:
    name: consume (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # 한 버전의 실패가 다른 버전의 결과를 가리지 않게 한다.
      fail-fast: false
      matrix:
        node: ["24.18", "24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # 빌드와 pack은 모든 matrix 버전에서 Node 24로 한다. matrix 버전에서 빌드하는 것은 이 검사의 대상이 아니다.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # tarball 경로는 다음 단계로 넘긴다. 외부 action 없이 같은 job 안에서 전달한다.
      - name: pack
        id: pack
        working-directory: packages/projectfile
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/pack"
          echo "tarball=$(ls "$RUNNER_TEMP"/pack/*.tgz)" >> "$GITHUB_OUTPUT"

      # 여기부터 소비 검사만 matrix 버전으로 돈다. 설치와 실행 모두 이 버전의 node와 npm을 쓴다.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: 소비 검사
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: node packages/projectfile/scripts/check-consume.mjs "$TARBALL"
